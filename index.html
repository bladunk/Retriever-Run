<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20251c">
  <meta name="description" content="Follow a yellow Labrador into the Wildlands.">
  <title>Retriever Run | Wildlands</title>
</head>
<body>
  <main id="game" aria-label="Retriever Run">
    <canvas id="trail" aria-label="3D wetlands trail"></canvas>
    <div class="vignette"></div>
    <header>
      <div class="brand"><span aria-hidden="true">◆</span> RETRIEVER RUN</div>
      <div class="tools">
        <button id="settings" type="button">Settings</button>
        <button id="pause" type="button" hidden>Pause</button>
      </div>
    </header>
    <section id="hud" hidden aria-label="Run statistics">
      <dl>
        <div><dt>Score</dt><dd id="score">0</dd></div>
        <div><dt>Distance</dt><dd id="distance">0 m</dd></div>
        <div><dt>Best</dt><dd id="best">0</dd></div>
      </dl>
      <div class="meter">
        <label id="meter-label" for="charge">Good Boy Meter</label>
        <progress id="charge" max="100" value="0"></progress>
      </div>
      <p id="combo" hidden></p>
    </section>
    <div id="conditions" hidden><span id="habitat"></span><span id="weather"></span></div>
    <div id="callout" class="callout" aria-hidden="true"></div>
    <section id="menu" class="menu" aria-labelledby="menu-title">
      <div class="menu-content">
        <p class="eyebrow" id="eyebrow">THE WILDLANDS UPDATE</p>
        <h1 id="menu-title">Retriever<br><em>Run</em></h1>
        <p id="menu-copy">Follow a yellow Lab through the cattails, creek beds, and flooded timber.</p>
        <p id="record" class="record" hidden></p>
        <button id="primary" class="primary" type="button">Start run <span aria-hidden="true">→</span></button>
        <p class="control-hint" id="hint">Swipe or use arrows to steer, jump, and duck.</p>
        <p class="rotate">Turn your phone sideways for a wider trail view.</p>
      </div>
    </section>
    <dialog id="preferences" aria-labelledby="preferences-title">
      <div class="preferences-heading">
        <h2 id="preferences-title">Field settings</h2>
        <button id="close-settings" type="button" aria-label="Close settings">×</button>
      </div>
      <label class="setting-row">Sound effects <input id="sfx" type="checkbox"></label>
      <label class="setting-row">Music <input id="soundtrack" type="checkbox"></label>
      <label class="setting-row">Render quality
        <select id="quality">
          <option value="auto">Auto</option><option value="low">Battery saver</option><option value="high">High</option>
        </select>
      </label>
      <fieldset>
        <legend>Outfitter</legend>
        <div id="outfits"></div>
      </fieldset>
    </dialog>
    <nav id="controls" aria-label="Touch controls" hidden>
      <div>
        <button data-move="left" aria-label="Move left">←</button>
        <button data-move="right" aria-label="Move right">→</button>
      </div>
      <div>
        <button data-move="slide" aria-label="Slide">↓</button>
        <button data-move="jump" aria-label="Jump">↑</button>
      </div>
    </nav>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
