<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Retriever Run · Environment gallery</title>
  <style>
    :root{font:16px system-ui,sans-serif;color:#f4e6cc;background:#212a22}
    *{box-sizing:border-box}
    body{margin:0;padding:clamp(16px,4vw,44px)}
    main{max-width:1040px;margin:auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px}
    h1{font:clamp(1.7rem,5vw,3.25rem) Georgia,serif;font-weight:600;margin:0}
    a{color:#f2c888}
    nav{display:flex;flex-wrap:wrap;gap:.55rem;margin:1.4rem 0 .8rem}
    button{min-height:44px;padding:.58rem .83rem;border:1px solid #aa9672;border-radius:5px;background:#302c23;color:inherit;font:inherit;cursor:pointer}
    button[aria-pressed=true]{color:#22271d;background:#e4c188;border-color:#e4c188}
    #scene{height:min(62vh,610px);min-height:280px;background:#354134;border:1px solid #947a58;border-radius:12px;overflow:hidden}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #caption{font-size:.96rem;line-height:1.5}
    #credits{font-size:.85rem;color:#dbc4a4;line-height:1.5}
  </style>
</head>
<body>
<main>
  <header><h1>Environment gallery</h1><a href="./">Retriever Run</a></header>
  <nav aria-label="Asset groups">
    <button type="button" data-view="trees" aria-pressed="true">Tree cards</button>
    <button type="button" data-view="grass" aria-pressed="false">Understory</button>
    <button type="button" data-view="south" aria-pressed="false">Southern woods</button>
    <button type="button" data-view="north" aria-pressed="false">Northern woods</button>
    <button type="button" data-view="corn" aria-pressed="false">Dry corn and stubble</button>
  </nav>
  <div id="scene"></div>
  <p id="caption" role="status">Loading asset comparison…</p>
  <p id="credits"><a href="https://sketchfab.com/3d-models/trees-and-bush-pack-lowpoly-f2a25ee70df440c9ab03d57aba2dc3f2">Tree cards by EFX</a> ·
    <a href="https://sketchfab.com/3d-models/realistic-grass-pack-for-games-free-9b958d613e9a44dbba580748e7a1789c">Grasses by Nicholas-3D</a> ·
    <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></p>
</main>
<script type="module" src="/src/environment-gallery.js"></script>
</body>
</html>
